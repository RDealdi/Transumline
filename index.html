    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0;
        }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(60, 82, 54, 0.4); border-radius: 10px; }
        
        /* Screen Transitions */
        .screen {
            position: absolute; inset: 0;
            width: 100%; height: 100%;
            overflow-y: auto; overflow-x: hidden;
            transition: opacity 0.4s ease, transform 0.4s ease;
        }
        
        #map { height: 100%; width: 100%; z-index: 1; }
        
        /* Leaflet popup styling override */
        .leaflet-popup-content-wrapper {
            background: #A2B79A; color: #111827;
            font-weight: 700; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }
        .leaflet-popup-tip { background: #A2B79A; }

        /* Loader Animation */
        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 40px; height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        /* Hide Scrollbar for Horizontal Scroll */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        select { -webkit-appearance: none; appearance: none; }

        /* Combobox (ketik & pilih titik) */
        .cb-list { overscroll-behavior: contain; }
        .cb-list li[aria-selected="true"] { background: rgba(162, 183, 154, 0.55); }

        /* Slider geser Visual Angkot */
        .visual-slider { -webkit-appearance: none; appearance: none; height: 8px; border-radius: 999px; background: rgba(60, 82, 54, 0.3); outline: none; cursor: pointer; }
        .visual-slider::-webkit-slider-thumb { -webkit-appearance: none; appearance: none; width: 24px; height: 24px; border-radius: 50%; background: #3C5236; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
        .visual-slider::-moz-range-thumb { width: 20px; height: 20px; border-radius: 50%; background: #3C5236; border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.4); }
        .visual-slider:focus-visible { box-shadow: 0 0 0 4px rgba(60, 82, 54, 0.35); }
        #angkotVisuals.dragging { scroll-snap-type: none; }

        /* Titik lokasi pengguna */
        .me-dot { position: relative; width: 18px; height: 18px; }
        .me-dot::before { content: ''; position: absolute; inset: 0; border-radius: 50%; background: #2563EB; border: 3px solid #fff; box-shadow: 0 1px 5px rgba(0,0,0,0.5); }
        .me-dot::after { content: ''; position: absolute; inset: -6px; border-radius: 50%; background: rgba(37, 99, 235, 0.35); animation: me-pulse 2s ease-out infinite; }
        @keyframes me-pulse { 0% { transform: scale(0.6); opacity: 1; } 100% { transform: scale(1.6); opacity: 0; } }
        @media (prefers-reduced-motion: reduce) { .me-dot::after { animation: none; } }

        /* Modal gambar angkot */
        @keyframes modal-pop { from { opacity: 0; transform: scale(0.96); } to { opacity: 1; transform: scale(1); } }
        .modal-pop { animation: modal-pop 0.2s ease-out; }
        @media (prefers-reduced-motion: reduce) { .modal-pop { animation: none; } }
    </style>
</head>
<body class="bg-brand-dark min-h-screen">

    <script>
        // --- 1. DATA KUMPULAN TRAYEK (16 Rute Spesifik) ---
        const rawTrayekData = [
            { id: "A1", name: "Cimahi – Cibeber", color: "Kuning", colorHex: "#EAB308", image: "img/cimahi-cibeber.jpg", path: "Terminal Pasar Antri, Cimahi Mall, Pojok, Gang Asem, Tagog, Gatot Subroto, Baros, Leuwigajah, Cibeber" },

            { id: "A3", name: "Cimahi – Cimindi", color: "Biru Tua", colorHex: "#1E3A8A", image: "img/cimahi-cimindi.jpg", path: "Terminal Pasar Antri, Cimahi Mall, Pojok, Gang Asem, Tagog, Gatot Subroto, Baros, Leuwigajah, Terminal Cimindi" },
            { id: "A4", name: "Cimahi – Padalarang", color: "Oranye", colorHex: "#F97316", image: "img/cimahi-padalarang.jpg", path: "Terminal Pasar Antri, Cimahi Mall, Pojok, Cisangkan, Padasuka, Gadobangkong, Cimareme, Pasar Padalarang, Stasiun Padalarang" },
            { id: "A5", name: "Cimahi – Leuwipanjang", color: "Hijau Jingga", colorHex: "#84CC16", image: "img/cimahi-leuwipanjang.jpg", path: "Terminal Pasar Antri, Pojok, Gatot Subroto, Terminal Pasar Atas, Tagog, Cibabat, Terminal Cimindi, Cibeureum, Rajawali, Soekarno-Hatta, Pasar Caringin, Perempatan Kopo, Leuwipanjang" },
            { id: "A6", name: "Cimahi – St. Hall Bandung", color: "Hijau", colorHex: "#22C55E", image: "img/cimahi-sthall.jpg", path: "Terminal Pasar Antri, Tagog, Terminal Pasar Atas, Cibabat, Terminal Cimindi, Cibeureum, Rajawali, Ciroyom, Pajajaran, Cicendo, Stasiun Bandung" },
            { id: "A7", name: "Cimahi – Cisarua", color: "Kuning", colorHex: "#EAB308", image: "img/cimahi-cisarua.jpg", path: "Terminal Pasar Atas, Kolonel Masturi, Jambudipa, SPN Cisarua, Curug Cimahi" },
            { id: "A8", name: "Cimahi – Parongpong", color: "Ungu", colorHex: "#9333EA", image: "img/cimahi-parongpong.jpg", path: "Terminal Pasar Antri, Gatot Subroto, Tagog, Cihanjuang, Cibaligo, Parongpong" },
            { id: "A9", name: "Cimahi – Soreang", color: "Hijau", colorHex: "#22C55E", image: "img/cimahi-soreang.jpg", path: "Terminal Pasar Antri, Stasiun Cimahi, Baros, Leuwigajah, Nanjung, Lagadar, Margaasih, Cipatik, Soreang" },
            { id: "A10", name: "Cimindi – Soreang", color: "Hijau", colorHex: "#22C55E", image: "img/cimindi-soreang.jpg", path: "Terminal Cimindi, Leuwigajah, Nanjung, Lagadar, Margaasih, Cipatik, Soreang" },

            { id: "A12", name: "Cimahi – Ledeng", color: "Hijau", colorHex: "#22C55E", image: "img/cimahi-ledeng.jpg", path: "Terminal Pasar Antri, Gatot Subroto, Tagog, Cihanjuang, Sukawargi, Ciwaruga, Gegerkalong, Ledeng" },
            { id: "A13", name: "Pasar Atas – Cilame", color: "Biru", colorHex: "#3B82F6", image: "img/pasaratas-cilame.jpg", path: "Terminal Pasar Atas, Kolonel Masturi, Puri Cipageran, Tani Mulya, Permata, Cilame" },

        let routes = [];
        let allStops = new Set();

        rawTrayekData.forEach(rt => {
            const stopsArray = rt.path.split(',').map(s => s.trim());
            routes.push({ ...rt, stops: stopsArray });
            stopsArray.forEach(stop => allStops.add(stop));
        });

        const sortedStops = Array.from(allStops).sort();

        // --- 2. KOORDINAT MAP ASLI ---
        const coordinateMap = {
            "Terminal Pasar Antri": [-6.880587633612607, 107.53812545892649],
            "Cimahi Mall": [-6.878454620681466, 107.5394788136182],

            "Tagog": [-6.875958249844658, 107.5461316669466],

            "Baros": [-6.8833, 107.5375],
            "Leuwigajah": [-6.8950, 107.5340],
            "Cibeber": [-6.9100, 107.5335],
            "Stasiun Cimahi": [-6.8858, 107.5361],
            "Dustira": [-6.8872, 107.5350],
            "Contong": [-6.8905, 107.5380],

        function getMockCoord(name) {
            if (coordinateMap[name]) return coordinateMap[name];
            const baseLat = -6.8724;
            const baseLng = 107.5451;
            let hash = 0;
            for (let i = 0; i < name.length; i++) hash = name.charCodeAt(i) + ((hash << 5) - hash);
            let latOffset = ((hash % 100) - 50) / 1500; 
            let lngOffset = (((hash >> 3) % 100) - 50) / 1500; 
            return [baseLat + latOffset, baseLng + lngOffset];
        }

        // --- 2b. FILTER TITIK YANG TERHUBUNG + COMBOBOX KETIK/PILIH ---
        // Titik yang bisa dicapai dari sebuah titik (maks. 4 angkot, sama dengan batas findShortestRoute).
        const reachCache = {};
        function reachableFrom(stop) {
            if (reachCache[stop]) return reachCache[stop];
            const reach = new Set();
            const seen = new Set();
            let frontier = routes.filter(r => r.stops.includes(stop));
            frontier.forEach(r => seen.add(r.id));
            for (let depth = 1; depth <= 4 && frontier.length; depth++) {
                const next = [];
                frontier.forEach(r => {
                    r.stops.forEach(st => reach.add(st));
                    routes.forEach(o => {
                        if (!seen.has(o.id) && o.stops.some(st => r.stops.includes(st))) {
                            seen.add(o.id);
                            next.push(o);
                        }
                    });
                });
                frontier = next;
            }
            reach.delete(stop);
            return (reachCache[stop] = reach);
        }

        // Daftar pilihan untuk sebuah kolom, berdasarkan nilai kolom pasangannya.
        function optionsFor(otherValue) {
            if (!otherValue) return { list: sortedStops, hint: '' };
            const reach = reachableFrom(otherValue);
            return {
                list: sortedStops.filter(st => reach.has(st)),
                hint: `Hanya titik yang terhubung dengan ${otherValue}`
            };
        }

        const escHtml = t => t.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        const escRegex = t => t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');

        const CB_SIZES = {
            lg: 'rounded-2xl p-4 md:p-5 pr-12 font-semibold shadow-inner focus:ring-4 focus:ring-brand-btn/30',
            sm: 'text-sm md:text-base rounded-xl p-3 md:p-4 pr-10 font-bold shadow-sm focus:ring-2 focus:ring-brand-btn'
        };
        const CB_ICON_CHEVRON = '<svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>';
        const CB_ICON_CLEAR = '<svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>';
        let cbCounter = 0;

        class Combobox {
            constructor(root, { placeholder, size = 'lg', getOptions, onSelect }) {
                this.getOptions = getOptions;
                this.onSelect = onSelect || (() => {});
                this._value = '';
                this.items = [];
                this.active = -1;
                this.isOpen = false;
                const id = 'cb' + (++cbCounter);

                root.classList.add('relative');
                root.innerHTML = `
                    <input type="text" id="${id}-input" role="combobox" aria-expanded="false" aria-controls="${id}-list" aria-autocomplete="list"
                           autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${placeholder}"
                           class="w-full bg-white/90 text-gray-800 outline-none transition truncate placeholder:text-gray-400 placeholder:font-medium ${CB_SIZES[size]}">
                    <button type="button" tabindex="-1" aria-label="Hapus pilihan"
                            class="absolute inset-y-0 right-0 flex items-center px-3 md:px-4 text-brand-dark"></button>
                    <ul id="${id}-list" role="listbox" class="cb-list hidden absolute left-0 right-0 top-full mt-2 max-h-60 overflow-y-auto bg-white rounded-xl shadow-2xl border border-gray-200 py-1 z-40"></ul>`;
                this.root = root;
                this.input = root.querySelector('input');
                this.btn = root.querySelector('button');
                this.list = root.querySelector('ul');
                this.updateIcon();

                this.input.addEventListener('focus', () => { this.input.select(); this.open(''); });
                this.input.addEventListener('click', () => { if (!this.isOpen) this.open(''); });
                this.input.addEventListener('input', () => this.open(this.input.value.trim()));
                this.input.addEventListener('blur', () => this.close());
                this.input.addEventListener('keydown', e => this.onKey(e));
                // mousedown + preventDefault agar input tidak kehilangan fokus sebelum item terpilih
                this.list.addEventListener('mousedown', e => {
                    e.preventDefault();
                    const li = e.target.closest('li[data-value]');
                    if (li) this.choose(li.dataset.value);
                });
                this.btn.addEventListener('mousedown', e => e.preventDefault());
                this.btn.addEventListener('click', () => {
                    if (this._value) { this.clear(); this.input.focus(); }
                    else if (this.isOpen) this.close();
                    else this.input.focus();
                });
            }

            get value() { return this._value; }
            set value(v) {
                this._value = v || '';
                this.input.value = this._value;
                this.updateIcon();
            }

            clear() {
                this.value = '';
                this.onSelect('');
                this.open('');
            }

            updateIcon() {
                this.btn.innerHTML = this._value ? CB_ICON_CLEAR : CB_ICON_CHEVRON;
                this.btn.setAttribute('aria-label', this._value ? 'Hapus pilihan' : 'Buka daftar');
            }

            open(query) {
                const { list, hint } = this.getOptions();
                const q = query.toLowerCase();
                let items = list;
                if (q) {
                    const score = name => { const n = name.toLowerCase(); return n.startsWith(q) ? 0 : n.includes(' ' + q) ? 1 : 2; };
                    items = list.filter(n => n.toLowerCase().includes(q))
                                .sort((a, b) => score(a) - score(b) || a.localeCompare(b));
                }
                this.items = items;
                this.active = q ? (items.length ? 0 : -1) : items.indexOf(this._value);

                const re = q ? new RegExp(escRegex(query), 'ig') : null;
                let html = hint ? `<li class="px-4 py-2 text-[11px] font-semibold text-gray-500 bg-gray-50 border-b border-gray-100 pointer-events-none">${escHtml(hint)}</li>` : '';
                if (!items.length) {
                    html += `<li class="px-4 py-3 text-sm text-gray-500 pointer-events-none">Titik tidak ditemukan</li>`;
                } else {
                    html += items.map((name, i) => {
                        const label = re ? escHtml(name).replace(re, m => `<b class="text-brand-btn">${m}</b>`) : escHtml(name);
                        return `<li role="option" id="${this.input.id}-opt${i}" data-value="${escHtml(name)}" data-index="${i}" aria-selected="${i === this.active}"
                                    class="px-4 py-2.5 cursor-pointer text-gray-800 text-sm md:text-base ${name === this._value ? 'font-extrabold' : 'font-semibold'}">${label}</li>`;
                    }).join('');
                }
                this.list.innerHTML = html;
                this.list.classList.remove('hidden');
                this.root.classList.add('z-30');
                this.isOpen = true;
                this.input.setAttribute('aria-expanded', 'true');
                this.scrollToActive();
                this.list.scrollIntoView({ block: 'nearest' });
            }

            close() {
                if (!this.isOpen) return;
                this.isOpen = false;
                this.list.classList.add('hidden');
                this.root.classList.remove('z-30');
                this.input.setAttribute('aria-expanded', 'false');
                this.input.value = this._value; // kembalikan teks ke pilihan terakhir
            }

            move(delta) {
                if (!this.items.length) return;
                this.active = (this.active + delta + this.items.length) % this.items.length;
                this.list.querySelectorAll('li[role="option"]').forEach(li => li.setAttribute('aria-selected', li.dataset.index == this.active));
                this.scrollToActive();
            }

            scrollToActive() {
                const li = this.list.querySelector(`li[data-index="${this.active}"]`);
                if (li) li.scrollIntoView({ block: 'nearest' });
            }

            onKey(e) {
                if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
                    e.preventDefault();
                    if (!this.isOpen) this.open(''); else this.move(e.key === 'ArrowDown' ? 1 : -1);
                } else if (e.key === 'Enter') {
                    if (this.isOpen && this.active >= 0) { e.preventDefault(); this.choose(this.items[this.active]); }
                } else if (e.key === 'Escape') {
                    this.close();
                }
            }

            choose(name) {
                this.value = name;
                this.close();
                this.input.blur();
                this.onSelect(name);
            }
        }

        // Buat sepasang kolom awal/tujuan yang saling memfilter.
        function createPair(startEl, destEl, size) {
            const pair = {};
            pair.start = new Combobox(startEl, {
                placeholder: 'Ketik atau pilih titik awal...', size,
                getOptions: () => optionsFor(pair.dest.value),
                onSelect: v => { if (v && pair.dest.value && !reachableFrom(v).has(pair.dest.value)) pair.dest.value = ''; }
            });
            pair.dest = new Combobox(destEl, {
                placeholder: 'Ketik atau pilih tujuan...', size,
                getOptions: () => optionsFor(pair.start.value),
                onSelect: v => { if (v && pair.start.value && !reachableFrom(v).has(pair.start.value)) pair.start.value = ''; }
            });
            return pair;
        }

        // --- 3. INISIALISASI UI ---
        const ui = {
            screenLoader: document.getElementById('screen-loader'),
            screenSearch: document.getElementById('screen-search'),

        const pair2 = createPair(document.getElementById('startSelect2'), document.getElementById('destSelect2'), 'sm');

        ui.s2Start = pair2.start; ui.s2Dest = pair2.dest;

        function switchScreen(hideElem, showElem) {
            hideElem.classList.remove('opacity-100', 'pointer-events-auto');
            hideElem.classList.add('opacity-0', 'pointer-events-none');
            setTimeout(() => {

        // --- 4. ALGORITMA PENCARIAN RUTE ---
        function getSubPath(arr, from, to) {
            let i1 = arr.indexOf(from);
            let i2 = arr.indexOf(to);
            if (i1 === -1 || i2 === -1) return [];
            let start = Math.min(i1, i2);
            let end = Math.max(i1, i2);
            let path = arr.slice(start, end + 1);
            if (i1 > i2) path.reverse();
            return path;
        }

        function findShortestRoute(start, end) {
            if (start === end) return { error: "Titik Awal dan Tujuan tidak boleh sama." };
            let queue = []; 
            routes.forEach(r => {
                if (r.stops.includes(start)) queue.push({ routes: [r], stops: [start] });
            });
            let visitedRoutesSets = new Set();

            while (queue.length > 0) {
                let current = queue.shift();
                let lastRoute = current.routes[current.routes.length - 1];
                if (lastRoute.stops.includes(end)) {
                    current.stops.push(end);
                    return buildLegs(current);
                }
                if (current.routes.length >= 4) continue;
                let pathSignature = current.routes.map(r=>r.id).join('-');
                if (visitedRoutesSets.has(pathSignature)) continue;
                visitedRoutesSets.add(pathSignature);

                for (let nextRoute of routes) {
                    if (!current.routes.find(r => r.id === nextRoute.id)) {
                        let intersection = lastRoute.stops.find(s => nextRoute.stops.includes(s));
                        if (intersection) {
                            queue.push({
                                routes: [...current.routes, nextRoute],
                                stops: [...current.stops, intersection]
                            });
                        }
                    }
                }
            }
            return { error: "Maaf, belum ada jalur angkot yang terhubung antara kedua titik tersebut." };
        }

        function buildLegs(resultSequence) {
            let legs = [];
            for (let i = 0; i < resultSequence.routes.length; i++) {
                let route = resultSequence.routes[i];
                let fromStop = resultSequence.stops[i];
                let toStop = resultSequence.stops[i+1];
                legs.push({
                    route: route,
                    from: fromStop,
                    to: toStop,
                    path: getSubPath(route.stops, fromStop, toStop)
                });
            }
            legs.forEach(leg => {
                const d = legDistanceM(leg);
                leg.distance = d.m;
                leg.distanceExact = d.exact;
                leg.fare = legFare(d.m);
            });
            return {
                legs: legs,
                fare: legs.reduce((s, l) => s + l.fare, 0),
                distance: legs.reduce((s, l) => s + l.distance, 0)
            };
        }

        // --- 4b. TARIF BERDASARKAN JARAK ---
        // Ubah angka di sini untuk menyesuaikan tarif.
        const FARE = {
            base: 4000,    // tarif dasar per angkot (Rp)
            baseKm: 3,     // jarak yang sudah termasuk tarif dasar (km)
            perKm: 500,    // tambahan per km setelah jarak dasar (Rp)
            round: 500,    // pembulatan ke atas (Rp)
            detour: 1.3    // pengali jarak garis lurus -> jarak jalan (jika data jalan tidak tersedia)
        };

        function haversine(a, b) {
            const R = 6371000, rad = Math.PI / 180;
            const dLat = (b[0] - a[0]) * rad, dLng = (b[1] - a[1]) * rad;
            const h = Math.sin(dLat / 2) ** 2 + Math.cos(a[0] * rad) * Math.cos(b[0] * rad) * Math.sin(dLng / 2) ** 2;
            return 2 * R * Math.asin(Math.sqrt(h));
        }

        // Jarak satu angkot: pakai data jalan asli bila ada, jika tidak pakai garis lurus x faktor kelokan.
        function legDistanceM(leg) {
            const road = getLegDistance(leg);
            if (road != null) return { m: road, exact: true };
            let straight = 0;
            for (let i = 0; i < leg.path.length - 1; i++) straight += haversine(stopCoord(leg.path[i]), stopCoord(leg.path[i + 1]));
            return { m: straight * FARE.detour, exact: false };
        }

        function legFare(meters) {
            const km = meters / 1000;
            const raw = FARE.base + Math.max(0, km - FARE.baseKm) * FARE.perKm;
            return Math.ceil(raw / FARE.round) * FARE.round;
        }

        const fmtRp = n => `Rp ${n.toLocaleString('id-ID')}`;
        const fmtKm = m => (m / 1000).toLocaleString('id-ID', { maximumFractionDigits: 1 });

        // --- 5. LOGIKA UI ---

            let dest = sourceScreen === 1 ? ui.s1Dest.value : ui.s2Dest.value;
            let errElem = sourceScreen === 1 ? ui.err1 : ui.err2;

            if (!start || !dest) {
                showError(errElem, "Silakan pilih titik awal dan tujuan terlebih dahulu.");
                return;
            }

            const result = findShortestRoute(start, dest);
            if (result.error) {
                showError(errElem, result.error);
                return;
            }

            ui.s2Start.value = start;
            ui.s2Dest.value = dest;
            if(errElem === ui.err2) ui.err2.classList.add('hidden');

            renderResults(result);

            if (sourceScreen === 1) {
                switchScreen(ui.screenSearch, ui.screenResult);
            }
            
            setTimeout(() => drawMap(result.legs), 500);
        }

                                 alt="${leg.route.name}"
                                 onerror="this.onerror=null; this.outerHTML=\`${fallbackHtml}\`;" >
                            <div class="absolute top-2 right-2 bg-black/50 text-white rounded-full p-1.5 pointer-events-none">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-4.35-4.35M11 8v6M8 11h6M17 11a6 6 0 11-12 0 6 6 0 0112 0z"></path></svg>
                            </div>
                        </div>
                        <div class="h-9 flex items-center justify-center bg-gray-50 text-[10px] uppercase font-black tracking-widest text-brand-dark border-t border-gray-200">
                            Angkot ${index + 1}
                        </div>
                    </div>`;

                if (!isLast) {
                    visualHtml += `<div class="flex-none text-brand-dark/30 font-extrabold text-3xl">→</div>`;
                }
            });

            detailHtml += `</ol>`;
            detailsDiv.innerHTML = detailHtml;
            visualDiv.innerHTML = visualHtml;
            visualDiv.scrollLeft = 0;
            syncVisualSlider();
            document.getElementById('screen-result').scrollTo(0,0);
        }

        // --- 5b. SLIDER GESER VISUAL ANGKOT ---
        const visualEl = document.getElementById('angkotVisuals');
        const sliderEl = document.getElementById('visualSlider');
        const sliderWrap = document.getElementById('visualSliderWrap');

        function syncVisualSlider() {
            const maxScroll = visualEl.scrollWidth - visualEl.clientWidth;
            const overflow = maxScroll > 4;
            sliderWrap.classList.toggle('hidden', !overflow);
            sliderWrap.classList.toggle('flex', overflow);
            if (overflow) sliderEl.value = Math.round((visualEl.scrollLeft / maxScroll) * 100);
        }

        sliderEl.addEventListener('input', () => {
            const maxScroll = visualEl.scrollWidth - visualEl.clientWidth;
            visualEl.scrollLeft = (sliderEl.value / 100) * maxScroll;
        });
        sliderEl.addEventListener('pointerdown', () => visualEl.classList.add('dragging'));
        ['pointerup', 'pointercancel', 'blur'].forEach(ev => sliderEl.addEventListener(ev, () => visualEl.classList.remove('dragging')));
        visualEl.addEventListener('scroll', syncVisualSlider, { passive: true });
        document.getElementById('visualPrev').addEventListener('click', () => visualEl.scrollBy({ left: -240, behavior: 'smooth' }));
        document.getElementById('visualNext').addEventListener('click', () => visualEl.scrollBy({ left: 240, behavior: 'smooth' }));
        // Hitung ulang saat layar hasil muncul / ukuran berubah
        if (window.ResizeObserver) new ResizeObserver(syncVisualSlider).observe(visualEl);
        window.addEventListener('resize', syncVisualSlider);

        // --- 6. GEOMETRI JALAN (rute mengikuti ruas jalan asli) ---
        // data/route-geometry.json berisi:
        //  - stops: koordinat halte yang sudah ditempelkan ke jalan utama
        //  - segments["A|B"]: polyline jalan dari halte A ke halte B (sesuai arah)
        // Dibuat oleh tools/generate-route-geometry.mjs (data OpenStreetMap via OSRM).
        let roadData = { stops: {}, segments: {} };
        const roadDataReady = fetch('data/route-geometry.json')
            .then(r => r.ok ? r.json() : null)
            .then(d => { if (d) roadData = d.segments ? { stops: d.stops || {}, segments: d.segments } : { stops: {}, segments: d }; })
            .catch(() => {});
        const liveSegmentCache = {};

        function stopCoord(name) {
            return (roadData.stops[name] && roadData.stops[name].c) || getMockCoord(name);
        }

        // Ambil ruas jalan antar dua halte; fallback ke OSRM langsung, lalu garis lurus.
        async function getSegment(a, b) {
            const key = `${a}|${b}`;
            if (roadData.segments[key]) return roadData.segments[key].c;
            if (liveSegmentCache[key]) return liveSegmentCache[key];
            const p1 = stopCoord(a), p2 = stopCoord(b);
            try {
                const url = `https://router.project-osrm.org/route/v1/driving/${p1[1]},${p1[0]};${p2[1]},${p2[0]}?overview=full&geometries=geojson`;
                const json = await (await fetch(url)).json();
                if (json.code === 'Ok') {
                    const c = json.routes[0].geometry.coordinates.map(([lng, lat]) => [lat, lng]);
                    liveSegmentCache[key] = c;
                    return c;
                }
            } catch (e) { /* abaikan, pakai garis lurus */ }
            return [p1, p2];
        }

        async function getLegGeometry(leg) {
            let coords = [];
            for (let i = 0; i < leg.path.length - 1; i++) {
                const seg = await getSegment(leg.path[i], leg.path[i + 1]);
                coords = coords.concat(i === 0 ? seg : seg.slice(1));
            }
            return coords.length ? coords : [stopCoord(leg.path[0])];
        }

        function getLegDistance(leg) {
            let total = 0;
            for (let i = 0; i < leg.path.length - 1; i++) {
                const seg = roadData.segments[`${leg.path[i]}|${leg.path[i + 1]}`];
                if (!seg) return null;
                total += seg.d;
            }
            return total;
        }

        // Panah arah perjalanan di sepanjang polyline
        function addDirectionArrows(coords, color, layer) {
            if (!mapInstance || coords.length < 2) return;
            const pts = coords.map(c => mapInstance.project(L.latLng(c), 16));
            let total = 0;
            for (let i = 1; i < pts.length; i++) total += pts[i].distanceTo(pts[i - 1]);
            const spacing = Math.max(total / 8, 250);
            let next = spacing / 2, acc = 0;
            for (let i = 1; i < pts.length; i++) {
                const segLen = pts[i].distanceTo(pts[i - 1]);
                while (segLen > 0 && acc + segLen >= next) {
                    const t = (next - acc) / segLen;
                    const p = pts[i - 1].add(pts[i].subtract(pts[i - 1]).multiplyBy(t));
                    const angle = Math.atan2(pts[i].y - pts[i - 1].y, pts[i].x - pts[i - 1].x) * 180 / Math.PI;
                    L.marker(mapInstance.unproject(p, 16), {
                        interactive: false,
                        icon: L.divIcon({
                            className: '',
                            html: `<div style="transform:rotate(${angle}deg);width:16px;height:16px;display:flex;align-items:center;justify-content:center;"><svg width="14" height="14" viewBox="0 0 24 24"><path d="M5 4l14 8-14 8 4-8z" fill="white" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/></svg></div>`,
                            iconSize: [16, 16], iconAnchor: [8, 8]
                        })
                    }).addTo(layer);
                    next += spacing;
                }
                acc += segLen;
            }
        }

        // --- 6b. MODAL GAMBAR ANGKOT ---
        const imgModal = {
            el: document.getElementById('imageModal'),
            img: document.getElementById('imageModalImg'),
            fallback: document.getElementById('imageModalFallback'),
            label: document.getElementById('imageModalLabel'),
            title: document.getElementById('imageModalTitle'),
            sub: document.getElementById('imageModalSub'),
            prev: document.getElementById('imageModalPrev'),
            next: document.getElementById('imageModalNext'),
            index: 0
        };

        function showModalImage() {
            const leg = currentLegs[imgModal.index];
            if (!leg) return;
            const total = currentLegs.length;
            imgModal.label.textContent = total > 1 ? `Angkot ${imgModal.index + 1} dari ${total}` : 'Angkot';
            imgModal.title.textContent = leg.route.name;
            imgModal.sub.textContent = `Warna ${leg.route.color} · ${leg.from} → ${leg.to}`;
            imgModal.prev.classList.toggle('hidden', total < 2);
            imgModal.next.classList.toggle('hidden', total < 2);

            imgModal.fallback.classList.add('hidden');
            imgModal.fallback.classList.remove('flex');
            imgModal.img.classList.remove('hidden');
            imgModal.img.onerror = () => {
                imgModal.img.classList.add('hidden');
                imgModal.fallback.style.backgroundColor = leg.route.colorHex;
                imgModal.fallback.textContent = `${leg.route.name} (${leg.route.color})`;
                imgModal.fallback.classList.remove('hidden');
                imgModal.fallback.classList.add('flex');
            };
            imgModal.img.alt = leg.route.name;
            imgModal.img.src = leg.route.image;
        }

        function openImageModal(index) {
            imgModal.index = index;
            showModalImage();
            imgModal.el.classList.remove('hidden');
            imgModal.el.classList.add('flex');
        }

        function closeImageModal() {
            imgModal.el.classList.add('hidden');
            imgModal.el.classList.remove('flex');
        }

        function stepImageModal(delta) {
            const total = currentLegs.length;
            if (total < 2) return;
            imgModal.index = (imgModal.index + delta + total) % total;
            showModalImage();
        }

        document.addEventListener('keydown', e => {
            if (imgModal.el.classList.contains('hidden')) return;
            if (e.key === 'Escape') closeImageModal();
            else if (e.key === 'ArrowLeft') stepImageModal(-1);
            else if (e.key === 'ArrowRight') stepImageModal(1);
        });

        // --- 7. LEAFLET MAP ---
        let mapInstance = null;
        let routeLayers = L.layerGroup();
        let drawToken = 0;

        // --- 7b. LOKASI SAYA ---
        let meLayer = null, meMarker = null, meCircle = null;
        let watchId = null, firstFix = true, statusTimer = null;
        const locateBtn = document.getElementById('locateBtn');
        const locateLabel = document.getElementById('locateLabel');
        const locateStatus = document.getElementById('locateStatus');

        function setLocateStatus(msg, hideAfterMs) {
            clearTimeout(statusTimer);
            if (!msg) { locateStatus.classList.add('hidden'); return; }
            locateStatus.textContent = msg;
            locateStatus.classList.remove('hidden');
            if (hideAfterMs) statusTimer = setTimeout(() => locateStatus.classList.add('hidden'), hideAfterMs);
        }

        function setLocateState(state) { // 'idle' | 'searching' | 'active'
            locateLabel.textContent = state === 'searching' ? 'Mencari...' : state === 'active' ? 'Ke Lokasi Saya' : 'Lokasi Saya';
            locateBtn.classList.toggle('text-blue-700', state === 'active');
            locateBtn.classList.toggle('text-brand-btn', state !== 'active');
            locateBtn.disabled = state === 'searching';
        }

        // Halte pada rute aktif yang paling dekat dengan posisi pengguna
        function nearestRouteStop(latlng) {
            let best = null;
            currentLegs.forEach(leg => leg.path.forEach(name => {
                const c = stopCoord(name);
                const d = haversine([latlng.lat, latlng.lng], c);
                if (!best || d < best.d) best = { name, c, d };
            }));
            return best;
        }

        function fmtDist(m) { return m >= 1000 ? `${fmtKm(m)} km` : `${Math.round(m)} m`; }

        function onPosition(pos) {
            const latlng = L.latLng(pos.coords.latitude, pos.coords.longitude);
            const acc = pos.coords.accuracy || 0;
            if (!meLayer) {
                meLayer = L.layerGroup().addTo(mapInstance);
                meCircle = L.circle(latlng, { radius: acc, color: '#2563EB', weight: 1, fillColor: '#2563EB', fillOpacity: 0.12, interactive: false }).addTo(meLayer);
                meMarker = L.marker(latlng, {
                    zIndexOffset: 2000,
                    icon: L.divIcon({ className: '', html: '<div class="me-dot"></div>', iconSize: [18, 18], iconAnchor: [9, 9] })
                }).addTo(meLayer);
            } else {
                meMarker.setLatLng(latlng);
                meCircle.setLatLng(latlng).setRadius(acc);
            }

            const near = nearestRouteStop(latlng);
            meMarker.bindPopup(`<div class="text-xs"><b>Lokasi Anda</b><br>Akurasi ±${Math.round(acc)} m${near ? `<br>Halte rute terdekat: <b>${escHtml(near.name)}</b> (±${fmtDist(near.d)})` : ''}</div>`);

            setLocateState('active');
            if (firstFix) {
                firstFix = false;
                if (near) mapInstance.fitBounds(L.latLngBounds([latlng, near.c]), { padding: [60, 60], maxZoom: 16 });
                else mapInstance.setView(latlng, 16);
                meMarker.openPopup();
                setLocateStatus(near ? `Halte rute terdekat: ${near.name} (±${fmtDist(near.d)})` : 'Lokasi Anda ditemukan.', 5000);
            }
        }

        function onPositionError(err) {
            stopLocating();
            const msg = err.code === 1 ? 'Izin lokasi ditolak. Aktifkan izin lokasi untuk situs ini di pengaturan browser.'
                      : err.code === 3 ? 'Waktu pencarian lokasi habis. Coba lagi di tempat terbuka.'
                      : 'Lokasi tidak tersedia saat ini. Pastikan GPS/lokasi perangkat aktif.';
            setLocateStatus(msg, 6000);
        }

        function locateMe() {
            if (!mapInstance) { setLocateStatus('Peta belum siap, tunggu sebentar.', 3000); return; }
            if (!navigator.geolocation) { setLocateStatus('Browser ini tidak mendukung fitur lokasi.', 4000); return; }
            if (!window.isSecureContext) { setLocateStatus('Fitur lokasi hanya berfungsi di halaman HTTPS atau localhost.', 5000); return; }

            // Sudah aktif: arahkan peta ke posisi terakhir
            if (watchId !== null && meMarker) {
                mapInstance.setView(meMarker.getLatLng(), Math.max(mapInstance.getZoom(), 16));
                meMarker.openPopup();
                return;
            }
            firstFix = true;
            setLocateState('searching');
            setLocateStatus('Mencari lokasi Anda...');
            watchId = navigator.geolocation.watchPosition(onPosition, onPositionError, { enableHighAccuracy: true, timeout: 15000, maximumAge: 5000 });
        }

        function stopLocating() {
            if (watchId !== null) { navigator.geolocation.clearWatch(watchId); watchId = null; }
            if (meLayer && mapInstance) { mapInstance.removeLayer(meLayer); }
            meLayer = meMarker = meCircle = null;
            setLocateState('idle');
        }

        async function drawMap(legs) {
            if (!mapInstance) {
                mapInstance = L.map('map', { zoomControl: false, attributionControl: true });
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19,
                    attribution: '&copy; OpenStreetMap contributors'
                }).addTo(mapInstance);
                routeLayers.addTo(mapInstance);
                mapInstance.setView(stopCoord(legs[0].from), 14);
            }

            const token = ++drawToken;
            await roadDataReady;
            const geometries = await Promise.all(legs.map(getLegGeometry));
            if (token !== drawToken) return; // pencarian baru sudah dimulai

            routeLayers.clearLayers();
            let allBounds = null;

            let makeIcon = (color, text) => L.divIcon({
                className: 'custom-div-icon',
                html: `<div style="background:${color};width:22px;height:22px;border-radius:50%;border:2px solid white;box-shadow:0 3px 6px rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:bold;">${text}</div>`,
                iconSize: [22, 22], iconAnchor: [11, 11]
            });

            legs.forEach((leg, legIndex) => {
                const coords = geometries[legIndex];
                const isDashed = legIndex % 2 !== 0;

                // Garis tepi (outline) agar rute kontras dengan peta
                L.polyline(coords, { color: '#1f2937', weight: 10, opacity: 0.35, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayers);
                let polyline = L.polyline(coords, {
                    color: leg.route.colorHex,
                    weight: 6,
                    opacity: 0.95,
                    lineCap: 'round',
                    lineJoin: 'round',
                    dashArray: isDashed ? '10, 10' : null
                }).addTo(routeLayers)
                  .bindPopup(`<div class="text-xs"><b>${leg.route.name}</b><br>${leg.from} → ${leg.to}</div>`);

                addDirectionArrows(coords, leg.route.colorHex, routeLayers);

                // Halte yang dilewati
                leg.path.slice(1, -1).forEach(stop => {
                    L.circleMarker(stopCoord(stop), { radius: 5, color: leg.route.colorHex, weight: 3, fillColor: '#fff', fillOpacity: 1 })
                        .addTo(routeLayers)
                        .bindPopup(`<div class="text-xs">${stop}</div>`);
                });

                let startMarker = L.marker(stopCoord(leg.from), { icon: makeIcon('#1D4ED8', legIndex + 1), zIndexOffset: 1000 })
                    .addTo(routeLayers)
                    .bindPopup(`<div class="text-xs"><b>Naik Angkot ${legIndex+1}:</b><br>${leg.from}<br><span style="font-weight:500">Arah: ${leg.to}</span></div>`);

                L.marker(stopCoord(leg.to), { icon: makeIcon('#B91C1C', 'X'), zIndexOffset: 1000 })
                    .addTo(routeLayers)
                    .bindPopup(`<div class="text-xs"><b>Turun:</b><br>${leg.to}</div>`);

                if (legIndex === 0) startMarker.openPopup();
                const b = polyline.getBounds();
                allBounds = allBounds ? allBounds.extend(b) : L.latLngBounds(b.getSouthWest(), b.getNorthEast());
            });

            if (allBounds) {
                mapInstance.invalidateSize();
                mapInstance.fitBounds(allBounds, { padding: [40, 40] });
            }
        }
    </script>
</body>
</html>
